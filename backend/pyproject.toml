[project]
name = "vision-lab"
version = "0.1.0"
description = "Local web lab for testing cube-detection vision models (robothon 2026)"
requires-python = ">=3.12,<3.13"
# Versions are pinned to the copies already in the local uv cache (2026-11-25 probe):
# with uv's clone link mode on APFS the environment then costs almost no extra disk.
# Keep exactly one OpenCV distribution (opencv-python); ultralytics depends on it.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "numpy==2.5.3",
    "opencv-python==5.1.0.95",
    "pillow==13.0.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "ultralytics==8.4.215",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
lab = "lab.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubevision", "lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
